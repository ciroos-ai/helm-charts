{{- if and (not .Values.namespaceScoped) (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
# On OpenShift the agents need a SecurityContextConstraints to run: the default restricted
# SCC assigns a random UID, which does not work with the fixed UID/GID and fsGroup (1000)
# the agents are configured with. Needs cluster-scoped create permission on SCCs and
# RBAC at install time.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: ciroos-agent
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
requiredDropCapabilities:
- ALL
runAsUser:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
- runtime/default
readOnlyRootFilesystem: false
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:ciroos-agent
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
rules:
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  resourceNames: ["ciroos-agent"]
  verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ciroos-agent-scc
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:ciroos-agent
subjects:
{{- range $sa := list "beacon-sa" "ebpf-topo-reducer" "eventrouter-controller" "insight-controller" "nexus-agent-controller" "source-repository-watcher-controller" "vector" }}
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
---
# The eBPF collector (hostPID, hostPath, BPF capabilities) and the otel-collector DaemonSet
# need the privileged SCC.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ciroos-agent-scc-privileged
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
{{- range $sa := list "ebpf-topo-coll" "otelcollector" }}
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
