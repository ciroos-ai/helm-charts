{{- if .Values.nexusAgent.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventrouter-remote-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: eventrouter
    ciroos.ai/purpose: remote-eventrouter-template
  {{- include "ciroos-agents.labels" . | nindent 4 }}
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: eventrouter
      name: eventrouter-remote
      namespace: {{ .Release.Namespace }}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: eventrouter
      template:
        metadata:
          annotations:
            kubectl.kubernetes.io/default-container: controller
          labels:
            app.kubernetes.io/name: eventrouter
        spec:
          imagePullSecrets:
            - name: regcred
          containers:
          - args:
            - --v=0
            - --configuration=eventrouter-gvks
            - --deploymentName=eventrouter-remote
            - --discard-managed-fields=true
            command:
            - /manager
            env:
            - name: TOTAL_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            image: '{{ .Values.eventrouterController.controller.image.repository }}:{{ .Values.eventrouterController.controller.image.tag }}'
            livenessProbe:
             failureThreshold: 5
             httpGet:
               path: /healthz
               port: 8081
             initialDelaySeconds: 30
             periodSeconds: 20
             timeoutSeconds: 10
            name: controller
            ports: []
            readinessProbe:
              failureThreshold: 10
              httpGet:
                path: /readyz
                port: 8081
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 10
            resources:
              limits:
                cpu: {{ "{{ .CPULimit }}" }}
                memory: {{ "{{ .MemLimit }}" }}
              requests:
                cpu: {{ "{{ .CPURequest }}" }}
                memory: {{ "{{ .MemRequest }}" }}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: eventrouter-controller
          terminationGracePeriodSeconds: 10
          volumes:
          - emptyDir: {}
            name: tmp-volume
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insight-remote-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: insight
    ciroos.ai/purpose: remote-insight-template
  {{- include "ciroos-agents.labels" . | nindent 4 }}
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: insight
      name: insight-remote
      namespace: {{ .Release.Namespace }}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: insight
      template:
        metadata:
          annotations:
            kubectl.kubernetes.io/default-container: controller
          labels:
            app.kubernetes.io/name: insight
        spec:
          imagePullSecrets:
            - name: regcred
          containers:
          - args:
            - --v=0
            - --namespace-scoped=false
            - --vector-url=http://vector-service:8999/k8s/insights
            command:
            - /manager
            env:
            - name: TOTAL_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            image: '{{ .Values.insightController.controller.image.repository }}:{{ .Values.insightController.controller.image.tag }}'
            livenessProbe:
              failureThreshold: 5
              httpGet:
                path: /healthz
                port: 8081
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 10
            name: controller
            ports: []
            readinessProbe:
              failureThreshold: 10
              httpGet:
                path: /readyz
                port: 8081
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 10
            resources:
              limits:
                cpu: {{ "{{ .CPULimit }}" }}
                memory: {{ "{{ .MemLimit }}" }}
              requests:
                cpu: {{ "{{ .CPURequest }}" }}
                memory: {{ "{{ .MemRequest }}" }}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts: []
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: insight-controller
          terminationGracePeriodSeconds: 10
          volumes: []
{{- end }}
