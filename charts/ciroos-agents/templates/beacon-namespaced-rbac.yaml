{{- if and (not .Values.beacon.readAllResources) .Values.beacon.namespacedReadRules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beacon-namespaced-role
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.beacon.namespacedReadRules | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beacon-namespaced-rolebinding
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: 'beacon-namespaced-role'
subjects:
- kind: ServiceAccount
  name: 'beacon-sa'
  namespace: '{{ .Release.Namespace }}'
{{- end }}
