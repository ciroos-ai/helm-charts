{{- if .Values.namespaceScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: eventrouter-controller-role
rules:
- apiGroups:
    - ""
    - events.k8s.io
  resources:
    - events
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - '*'
  resources:
    - '*'
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - lib.ciroos.ai
  resources:
    - agenthealths
  verbs:
    - create
    - delete
    - get
    - list
    - update
    - watch
- apiGroups:
    - lib.ciroos.ai
  resources:
    - agenthealths/status
    - namespacedresourcewatchers
  verbs:
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - lib.ciroos.ai
  resources:
    - alerts
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - lib.ciroos.ai
  resources:
    - namespacedresourcewatchers/status
  verbs:
    - get
    - patch
    - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eventrouter-controller-role
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - endpoints
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumeclaims/status
  - pods
  - pods/status
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  - issuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - projectcontour.io
  resources:
  - httpproxies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lib.ciroos.ai
  resources:
  - agenthealths
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - lib.ciroos.ai
  resources:
  - agenthealths/status
  - resourcewatchers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lib.ciroos.ai
  resources:
  - alerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lib.ciroos.ai
  resources:
  - resourcewatchers/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eventrouter-config-events-role
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eventrouter-config-events-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eventrouter-config-events-role
subjects:
- kind: ServiceAccount
  name: 'eventrouter-controller'
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eventrouter-secrets-role
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eventrouter-secrets-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "ciroos-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eventrouter-secrets-role
subjects:
- kind: ServiceAccount
  name: 'eventrouter-controller'
  namespace: '{{ .Release.Namespace }}'
{{- end }}