namespaceScoped: false
# Extra cluster-wide RBAC rules, empty by default. Granted to beacon via the
# beacon-extra-permission ClusterRole/ClusterRoleBinding (independent of
# namespaceScoped, since this is always meant to be cluster-wide), for
# anything the curated beacon.readAllResources:false rule set
# (ciroos-agents.beaconReadRules) doesn't cover. There is no sveltos here to
# also grant this to, unlike the managed ciroos chart.
extraClusterRoleRules: []
clusterNamespace: ""
clusterName: "cluster-name"
ingressFqdn: ""
ciroosIngressUrl: ""
ciroosDockerconfigjson: ""
ciroosCaCrt: ""
ciroosTlsCrt: ""
ciroosTlsKey: ""
kind: Secret
beacon:
  beacon:
    image:
      repository: registry.ciroos.ai/netra/beacon
      tag: b4c2bec9c-3dd4036c7-261118T1437Z@sha256:374d1ba1ae7d1d2eb1814844c6fdea7c87e377e81daf0dfa7ecb8870409030ef
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  replicas: 1
  podSecurityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  impersonate: false
  impersonatedServiceAccounts: []
  managePods: true
  # Extra RBAC rules granted to beacon only within the release namespace (Role + RoleBinding).
  # Empty by default. Only honored when readAllResources is false.
  namespacedReadRules: []
  readAllResources: true
beaconSa:
  serviceAccount:
    annotations: {}
