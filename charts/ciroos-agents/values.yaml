insightController:
  enabled: true
  # Run the CSI, VolumeSnapshot and Rook-Ceph detectors. They need cluster-wide read access
  # to storage.k8s.io (CSIDriver, CSINode, StorageClass, VolumeAttachment),
  # snapshot.storage.k8s.io and ceph.rook.io, which the insight-controller ClusterRole grants
  # only when this is true. When false the rules are omitted and the controller is started
  # with --storage-detectors=false. Ignored when namespaceScoped is true.
  storageDetectors: true
  controller:
    image:
      repository: registry.ciroos.ai/netra/insight
      tag: 8196b9d39-3dd4036c7-261118T1437Z@sha256:cc2a3a5db44a5bfcf508bbe0e936c28713c06da95ca1638b02a3c571a35ec433
