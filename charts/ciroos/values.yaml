clusterNamespace: ""
clusterName: ""
kubernetesClusterDomain: cluster.local
pullmodeSecret:
  kubeconfig: ""
uninstaller:
  annotations: {}
  labels: {}
  tolerations: []
  nodeSelector: {}
  uninstall:
    args:
      - --skip-projectsveltos=false
    image:
      repository: registry.ciroos.ai/ciroos/uninstaller
      tag: bfd285221-2974753e1-260402T1435Z
sveltosApplierManager:
  annotations: {}
  labels: {}
  tolerations: []
  nodeSelector: {}
  # When true, sveltos-applier-manager-read-permission grants cluster-wide
  # read (get/list/watch) on every apiGroup/resource, including Secrets.
  # Set to false to restrict it to a curated list of apiGroups/resources
  # (see ciroos.sveltosApplierReadRules in _helpers.tpl) that excludes
  # Secrets but must stay a superset of every ClusterRole/Role
  # sveltos-applier-manager installs on the managed cluster.
  readAllResources: true
  controller:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    image:
      repository: registry.ciroos.ai/runtime/projectsveltos/sveltos-applier
      tag: 1.13.0-fbc287b5eb63
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  serviceAccount:
    annotations: {}
sveltosApplierMetricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
