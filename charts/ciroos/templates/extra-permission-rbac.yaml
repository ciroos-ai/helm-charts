apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ciroos-extra-permission
  labels:
  {{- include "ciroos.labels" . | nindent 4 }}
rules:
{{- toYaml (.Values.extraClusterRoleRules | default list) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ciroos-extra-binding
  labels:
  {{- include "ciroos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'ciroos-extra-permission'
subjects:
- kind: ServiceAccount
  name: 'sveltos-applier-manager'
  namespace: projectsveltos
- kind: ServiceAccount
  name: 'beacon-sa'
  namespace: ciroos-agent
